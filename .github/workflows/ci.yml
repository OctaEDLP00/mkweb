name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash -n mkweb.sh
      - name: PowerShell syntax check
        run: pwsh -NoProfile -Command '[void][scriptblock]::Create((Get-Content -Raw mkweb.ps1))'
